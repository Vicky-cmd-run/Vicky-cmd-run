    <text x="18" y="98" class="skill-name">REST APIs &amp; ASYNC</text>
    <text x="234" y="98" text-anchor="end" class="skill-pct">90%</text>
    <rect x="18" y="105" width="216" height="6" rx="3" class="track" />
    <rect x="18" y="105" width="194" height="6" rx="3" fill="url(#barIndigo)" />

    <!-- Item 3 -->
    <text x="18" y="140" class="skill-name">STREAMLIT &amp; UI MODULES</text>
    <text x="234" y="140" text-anchor="end" class="skill-pct">90%</text>
    <rect x="18" y="147" width="216" height="6" rx="3" class="track" />
    <rect x="18" y="147" width="194" height="6" rx="3" fill="url(#barBlue)" />

    <!-- Item 4 -->
    <text x="18" y="182" class="skill-name">GIT / LINUX / GCP</text>
    <text x="234" y="182" text-anchor="end" class="skill-pct">86%</text>
    <rect x="18" y="189" width="216" height="6" rx="3" class="track" />
