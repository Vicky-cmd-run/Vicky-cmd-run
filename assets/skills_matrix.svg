<svg xmlns="http://www.w3.org/2000/svg" width="840" height="310" viewBox="0 0 840 310" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fbff" />
      <stop offset="100%" stop-color="#e0f2fe" />
    </linearGradient>
    <linearGradient id="barBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="barIndigo" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#0284c7" stroke-width="0.5" stroke-opacity="0.07" />
    </pattern>
  </defs>

  <style>
    .hud-title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-weight: 800;
      fill: #0f172a;
      font-size: 13px;
      letter-spacing: 2px;
    }
    .col-header {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-weight: 800;
      fill: #0284c7;
      font-size: 11.5px;
      letter-spacing: 1.2px;
    }
    .skill-name {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-weight: 700;
      fill: #1e293b;
      font-size: 11.5px;
    }
    .skill-pct {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-weight: 700;
      fill: #0284c7;
      font-size: 11.5px;
    }
    .track {
      fill: #e0f2fe;
    }
  </style>

  <!-- Background -->
  <rect width="840" height="310" rx="14" fill="url(#bgGrad)" stroke="#bae6fd" stroke-width="1.5" />
  <rect width="840" height="310" rx="14" fill="url(#grid)" />

  <!-- Header Bar -->
  <text x="28" y="34" class="hud-title">&lt; COGNITIVE_CAPABILITIES &amp; TECH_MATRIX &gt;</text>
  <line x1="28" y1="44" x2="812" y2="44" stroke="#bae6fd" stroke-width="1.5" />

  <!-- COLUMN 1: LANGUAGES & CORE (x=24, width=252) -->
  <g transform="translate(24, 58)">
    <rect width="252" height="228" rx="10" fill="#ffffff" fill-opacity="0.9" stroke="#bae6fd" stroke-width="1.2" />
    <text x="18" y="26" class="col-header">01 // LANGUAGES &amp; CORE</text>
    <line x1="18" y1="34" x2="234" y2="34" stroke="#f0f9ff" stroke-width="1.5" />

    <!-- Item 1 -->
    <text x="18" y="56" class="skill-name">PYTHON</text>
    <text x="234" y="56" text-anchor="end" class="skill-pct">95%</text>
    <rect x="18" y="63" width="216" height="6" rx="3" class="track" />
    <rect x="18" y="63" width="205" height="6" rx="3" fill="url(#barBlue)" />

    <!-- Item 2 -->
    <text x="18" y="98" class="skill-name">JAVASCRIPT / TS</text>
    <text x="234" y="98" text-anchor="end" class="skill-pct">88%</text>
    <rect x="18" y="105" width="216" height="6" rx="3" class="track" />
    <rect x="18" y="105" width="190" height="6" rx="3" fill="url(#barIndigo)" />

    <!-- Item 3 -->
    <text x="18" y="140" class="skill-name">JAVA &amp; OOP</text>
    <text x="234" y="140" text-anchor="end" class="skill-pct">82%</text>
    <rect x="18" y="147" width="216" height="6" rx="3" class="track" />
    <rect x="18" y="147" width="177" height="6" rx="3" fill="url(#barBlue)" />

    <!-- Item 4 -->
    <text x="18" y="182" class="skill-name">C++ / DSA / SQL</text>
    <text x="234" y="182" text-anchor="end" class="skill-pct">80%</text>
    <rect x="18" y="189" width="216" height="6" rx="3" class="track" />
    <rect x="18" y="189" width="173" height="6" rx="3" fill="url(#barIndigo)" />
  </g>

  <!-- COLUMN 2: AI & ML ORCHESTRATION (x=294, width=252) -->
  <g transform="translate(294, 58)">
    <rect width="252" height="228" rx="10" fill="#ffffff" fill-opacity="0.9" stroke="#bae6fd" stroke-width="1.2" />
    <text x="18" y="26" class="col-header" fill="#2563eb">02 // AI_ORCHESTRATION</text>
    <line x1="18" y1="34" x2="234" y2="34" stroke="#f0f9ff" stroke-width="1.5" />

    <!-- Item 1 -->
    <text x="18" y="56" class="skill-name">LANGCHAIN &amp; AGENTS</text>
    <text x="234" y="56" text-anchor="end" class="skill-pct">92%</text>
    <rect x="18" y="63" width="216" height="6" rx="3" class="track" />
    <rect x="18" y="63" width="198" height="6" rx="3" fill="url(#barIndigo)" />

    <!-- Item 2 -->
    <text x="18" y="98" class="skill-name">TENSORFLOW &amp; PYTORCH</text>
    <text x="234" y="98" text-anchor="end" class="skill-pct">85%</text>
    <rect x="18" y="105" width="216" height="6" rx="3" class="track" />
    <rect x="18" y="105" width="184" height="6" rx="3" fill="url(#barBlue)" />

    <!-- Item 3 -->
    <text x="18" y="140" class="skill-name">PANDAS / NUMPY / DATA</text>
    <text x="234" y="140" text-anchor="end" class="skill-pct">88%</text>
    <rect x="18" y="147" width="216" height="6" rx="3" class="track" />
    <rect x="18" y="147" width="190" height="6" rx="3" fill="url(#barIndigo)" />

    <!-- Item 4 -->
    <text x="18" y="182" class="skill-name">EXPLAINABLE AI (SHAP)</text>
    <text x="234" y="182" text-anchor="end" class="skill-pct">85%</text>
    <rect x="18" y="189" width="216" height="6" rx="3" class="track" />
    <rect x="18" y="189" width="184" height="6" rx="3" fill="url(#barBlue)" />
  </g>

  <!-- COLUMN 3: WEB & CLOUD SYSTEMS (x=564, width=252) -->
  <g transform="translate(564, 58)">
    <rect width="252" height="228" rx="10" fill="#ffffff" fill-opacity="0.9" stroke="#bae6fd" stroke-width="1.2" />
    <text x="18" y="26" class="col-header" fill="#0369a1">03 // WEB &amp; CLOUD_SYS</text>
    <line x1="18" y1="34" x2="234" y2="34" stroke="#f0f9ff" stroke-width="1.5" />

    <!-- Item 1 -->
    <text x="18" y="56" class="skill-name">REACT.JS &amp; NODE.JS</text>
    <text x="234" y="56" text-anchor="end" class="skill-pct">88%</text>
    <rect x="18" y="63" width="216" height="6" rx="3" class="track" />
    <rect x="18" y="63" width="190" height="6" rx="3" fill="url(#barBlue)" />

