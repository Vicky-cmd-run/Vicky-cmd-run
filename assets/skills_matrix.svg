<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 840 300" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090e" />
      <stop offset="100%" stop-color="#0b0e15" />
    </linearGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#00FFCC" stroke-width="0.5" stroke-opacity="0.04" />
    </pattern>
    <filter id="tealGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="purpleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&amp;family=Share+Tech+Mono&amp;display=swap');
    
    .mono-text {
      font-family: 'Share Tech Mono', monospace;
      fill: #ffffff;
      font-size: 12px;
      letter-spacing: 0.5px;
    }
    
    .hud-title {
      font-family: 'Orbitron', sans-serif;
      font-weight: bold;
      fill: #00FFCC;
      font-size: 12px;
      letter-spacing: 2px;
    }

    .tech-header {
      font-family: 'Orbitron', sans-serif;
      font-weight: 700;
      fill: #8A2BE2;
      font-size: 11px;
      letter-spacing: 1px;
    }

    .progress-bar-bg {
      fill: #141923;
    }
  </style>

  <!-- Background Base -->
  <rect width="840" height="300" fill="url(#bgGrad)" rx="8" />
  <rect width="840" height="300" fill="url(#grid)" rx="8" />
  
  <!-- Outer Border -->
  <rect x="10" y="10" width="820" height="280" fill="none" stroke="#00FFCC" stroke-width="1" stroke-opacity="0.15" rx="6" />

  <!-- Section Title -->
  <g transform="translate(30, 35)">
    <text x="0" y="0" class="hud-title">&lt; COGNITIVE_KNOWLEDGE_MATRIX &gt;</text>
    <line x1="0" y1="8" x2="780" y2="8" stroke="#00FFCC" stroke-width="1" stroke-opacity="0.15" />
  </g>

  <!-- COLUMN 1: LANGUAGES & CS -->
  <g transform="translate(30, 65)">
    <text x="0" y="15" class="tech-header" fill="#00FFCC">1. LANGUAGES_AND_DATA</text>
    
    <!-- Python -->
    <g transform="translate(0, 30)">
      <text x="0" y="10" class="mono-text">PYTHON</text>
      <text x="175" y="10" class="mono-text" fill="#00FFCC" font-weight="bold">95%</text>
      <rect x="0" y="18" width="210" height="5" class="progress-bar-bg" rx="2.5" />
      <rect x="0" y="18" width="200" height="5" fill="#00FFCC" rx="2.5" filter="url(#tealGlow)" />
    </g>

    <!-- JavaScript -->
    <g transform="translate(0, 70)">
      <text x="0" y="10" class="mono-text">JAVASCRIPT</text>
      <text x="175" y="10" class="mono-text" fill="#8A2BE2" font-weight="bold">85%</text>
      <rect x="0" y="18" width="210" height="5" class="progress-bar-bg" rx="2.5" />
      <rect x="0" y="18" width="178" height="5" fill="#8A2BE2" rx="2.5" />
    </g>

    <!-- Java -->
    <g transform="translate(0, 110)">
      <text x="0" y="10" class="mono-text">JAVA</text>
      <text x="175" y="10" class="mono-text" fill="#8A2BE2" font-weight="bold">80%</text>
      <rect x="0" y="18" width="210" height="5" class="progress-bar-bg" rx="2.5" />
      <rect x="0" y="18" width="168" height="5" fill="#8A2BE2" rx="2.5" />
    </g>

    <!-- C++ -->
    <g transform="translate(0, 150)">
      <text x="0" y="10" class="mono-text">C++</text>
      <text x="175" y="10" class="mono-text" fill="#8A2BE2" font-weight="bold">75%</text>
      <rect x="0" y="18" width="210" height="5" class="progress-bar-bg" rx="2.5" />
      <rect x="0" y="18" width="157" height="5" fill="#8A2BE2" rx="2.5" />
    </g>
  </g>

  <!-- COLUMN 2: AI & ML -->
  <g transform="translate(300, 65)">
    <text x="0" y="15" class="tech-header" fill="#8A2BE2">2. AI_ORCHESTRATION</text>
    
    <!-- LangChain -->
    <g transform="translate(0, 30)">
      <text x="0" y="10" class="mono-text">LANGCHAIN &amp; AGENTIC SDKs</text>
      <text x="175" y="10" class="mono-text" fill="#00FFCC" font-weight="bold">90%</text>
      <rect x="0" y="18" width="210" height="5" class="progress-bar-bg" rx="2.5" />
      <rect x="0" y="18" width="189" height="5" fill="#00FFCC" rx="2.5" filter="url(#tealGlow)" />
    </g>

    <!-- PyTorch / TF -->
    <g transform="translate(0, 70)">
      <text x="0" y="10" class="mono-text">PYTORCH &amp; TENSORFLOW</text>
      <text x="175" y="10" class="mono-text" fill="#8A2BE2" font-weight="bold">80%</text>
      <rect x="0" y="18" width="210" height="5" class="progress-bar-bg" rx="2.5" />
      <rect x="0" y="18" width="168" height="5" fill="#8A2BE2" rx="2.5" />
    </g>

    <!-- Streamlit / Pandas -->
    <g transform="translate(0, 110)">
      <text x="0" y="10" class="mono-text">STREAMLIT &amp; PANDAS / NUMPY</text>
      <text x="175" y="10" class="mono-text" fill="#8A2BE2" font-weight="bold">85%</text>
      <rect x="0" y="18" width="210" height="5" class="progress-bar-bg" rx="2.5" />
      <rect x="0" y="18" width="178" height="5" fill="#8A2BE2" rx="2.5" />
    </g>

    <!-- SHAP / IG -->
    <g transform="translate(0, 150)">
      <text x="0" y="10" class="mono-text">EXPLAINABLE AI (SHAP / IG)</text>
      <text x="175" y="10" class="mono-text" fill="#8A2BE2" font-weight="bold">80%</text>
      <rect x="0" y="18" width="210" height="5" class="progress-bar-bg" rx="2.5" />
      <rect x="0" y="18" width="168" height="5" fill="#8A2BE2" rx="2.5" />
    </g>
  </g>

  <!-- COLUMN 3: WEB & TOOLS -->
  <g transform="translate(570, 65)">
    <text x="0" y="15" class="tech-header" fill="#e200ff">3. WEB_SYSTEMS_AND_TOOLS</text>
    
    <!-- React / Node -->
    <g transform="translate(0, 30)">
      <text x="0" y="10" class="mono-text">REACT.JS &amp; NODE.JS</text>
      <text x="175" y="10" class="mono-text" fill="#00FFCC" font-weight="bold">85%</text>
      <rect x="0" y="18" width="210" height="5" class="progress-bar-bg" rx="2.5" />
      <rect x="0" y="18" width="178" height="5" fill="#00FFCC" rx="2.5" filter="url(#tealGlow)" />
    </g>

    <!-- GCP / Cloud -->
    <g transform="translate(0, 70)">
      <text x="0" y="10" class="mono-text">GCP / AWS EXPOSURE</text>
      <text x="175" y="10" class="mono-text" fill="#8A2BE2" font-weight="bold">80%</text>
      <rect x="0" y="18" width="210" height="5" class="progress-bar-bg" rx="2.5" />
      <rect x="0" y="18" width="168" height="5" fill="#8A2BE2" rx="2.5" />
    </g>

    <!-- Git/GitHub/VSCode -->
    <g transform="translate(0, 110)">
      <text x="0" y="10" class="mono-text">GIT / GITHUB &amp; VS CODE</text>
      <text x="175" y="10" class="mono-text" fill="#00FFCC" font-weight="bold">90%</text>
      <rect x="0" y="18" width="210" height="5" class="progress-bar-bg" rx="2.5" />
      <rect x="0" y="18" width="189" height="5" fill="#00FFCC" rx="2.5" filter="url(#tealGlow)" />
    </g>

    <!-- API Integration -->
    <g transform="translate(0, 150)">
      <text x="0" y="10" class="mono-text">REST APIs / INTEGRATION</text>
      <text x="175" y="10" class="mono-text" fill="#00FFCC" font-weight="bold">90%</text>
      <rect x="0" y="18" width="210" height="5" class="progress-bar-bg" rx="2.5" />
      <rect x="0" y="18" width="189" height="5" fill="#00FFCC" rx="2.5" filter="url(#tealGlow)" />
    </g>
  </g>

  <!-- Small corner decorations inside the grid boundary -->
  <path d="M 15 285 L 15 275 L 25 275" fill="none" stroke="#00FFCC" stroke-width="1.5" stroke-opacity="0.3" />
  <path d="M 825 285 L 825 275 L 815 275" fill="none" stroke="#00FFCC" stroke-width="1.5" stroke-opacity="0.3" />
</svg>
