<svg xmlns="http://www.w3.org/2000/svg" width="840" height="190" viewBox="0 0 840 190" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fbff" />
      <stop offset="100%" stop-color="#dbeafe" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#0284c7" stroke-width="0.5" stroke-opacity="0.06" />
    </pattern>
    <clipPath id="leftTextClip">
      <rect x="0" y="0" width="600" height="190" />
    </clipPath>
    <clipPath id="rightBoxClip">
      <rect x="0" y="0" width="184" height="148" rx="10" />
    </clipPath>
  </defs>

  <style>
    .hud-header {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-weight: 700;
      fill: #0284c7;
      font-size: 11px;
      letter-spacing: 1.2px;
    }
    .proj-title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-weight: 800;
      fill: #0f172a;
      font-size: 16px;
    }
    .tag-bg {
      fill: #e0f2fe;
      stroke: #7dd3fc;
      stroke-width: 1;
    }
    .tag-text {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-weight: 700;
      fill: #0369a1;
      font-size: 9.5px;
    }
    .bullet-icon {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-weight: 700;
      fill: #0284c7;
      font-size: 12px;
    }
    .bullet-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-weight: 500;
      fill: #1e293b;
      font-size: 12px;
    }
  </style>

  <!-- Card Background -->
  <rect width="840" height="190" rx="14" fill="url(#bgGrad)" stroke="#93c5fd" stroke-width="1.5" />
  <rect width="840" height="190" rx="14" fill="url(#grid)" />

  <!-- Left Accent Bar -->
  <rect x="0" y="24" width="6" height="142" rx="3" fill="url(#blueGrad)" />

  <!-- Left Content Area (Strictly clipped at X=600) -->
  <g clip-path="url(#leftTextClip)">
    <text x="26" y="32" class="hud-header">[ MODULE_03 // MYTHRA_MULTIMODAL_AI ]</text>
    <text x="26" y="56" class="proj-title">MYTHRA – Multimodal Storyteller Orchestration Engine</text>

    <!-- Tech Stack Pills -->
    <g transform="translate(26, 68)">
      <rect x="0" y="0" width="64" height="20" rx="5" class="tag-bg" />
      <text x="32" y="13.5" text-anchor="middle" class="tag-text">PYTHON</text>

      <rect x="72" y="0" width="70" height="20" rx="5" class="tag-bg" />
      <text x="107" y="13.5" text-anchor="middle" class="tag-text">REACT.JS</text>

      <rect x="150" y="0" width="80" height="20" rx="5" class="tag-bg" />
      <text x="190" y="13.5" text-anchor="middle" class="tag-text">REST_APIs</text>

      <rect x="238" y="0" width="114" height="20" rx="5" class="tag-bg" />
      <text x="295" y="13.5" text-anchor="middle" class="tag-text">LLM_DIFFUSION_TTS</text>
    </g>

    <!-- Concise Bullet Points (<540px wide) -->
    <g transform="translate(26, 108)">
      <text x="0" y="12" class="bullet-icon">&#9656;</text>
      <text x="16" y="12" class="bullet-text">Integrated 3 AI models (LLM, Text-to-Image, TTS) via REST APIs.</text>

      <text x="0" y="38" class="bullet-icon">&#9656;</text>
      <text x="16" y="38" class="bullet-text">Optimized async queues (-45% latency for 10-14 scene stories).</text>

      <text x="0" y="64" class="bullet-icon">&#9656;</text>
      <text x="16" y="64" class="bullet-text">Deployed interactive React UI handling 5 concurrent streams.</text>
    </g>
  </g>

  <!-- Right Telemetry Widget (Multimodal Flow Diagram, 184px wide) -->
  <g transform="translate(634, 21)" clip-path="url(#rightBoxClip)">
    <rect width="184" height="148" rx="10" fill="#ffffff" fill-opacity="0.95" stroke="#7dd3fc" stroke-width="1.5" />
    <text x="92" y="22" text-anchor="middle" class="tag-text" fill="#0284c7">PIPELINE_FLOW</text>
    <line x1="16" y1="30" x2="168" y2="30" stroke="#dbeafe" stroke-width="1.5" />

    <!-- Top Node: LLM -->
    <rect x="32" y="38" width="120" height="22" rx="4" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2" />
    <text x="92" y="52.5" text-anchor="middle" class="tag-text" font-size="9">COGNITIVE_LLM</text>

    <!-- Connector Lines -->
    <path d="M 92 60 L 92 68 M 52 68 L 132 68 M 52 68 L 52 76 M 132 68 L 132 76" stroke="#0284c7" stroke-width="1.2" />

    <!-- Split Nodes: Image (x=14, width=74) & Audio (x=96, width=74) -> 8px gap between them! -->
    <rect x="14" y="76" width="74" height="24" rx="4" fill="#f0f9ff" stroke="#38bdf8" stroke-width="1.2" />
    <text x="51" y="91.5" text-anchor="middle" class="tag-text" font-size="8.5">DIFFUSION</text>

    <rect x="96" y="76" width="74" height="24" rx="4" fill="#f0f9ff" stroke="#2563eb" stroke-width="1.2" />
    <text x="133" y="91.5" text-anchor="middle" class="tag-text" font-size="8.5">NEURAL_TTS</text>

    <!-- Bottom Metric Pill -->
    <rect x="16" y="114" width="152" height="22" rx="5" fill="#e0f2fe" stroke="#7dd3fc" stroke-width="1" />
    <text x="92" y="128.5" text-anchor="middle" class="tag-text" fill="#0369a1">LATENCY: -45% FAST</text>
  </g>
</svg>
