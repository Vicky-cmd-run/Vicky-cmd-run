<svg xmlns="http://www.w3.org/2000/svg" width="840" height="190" viewBox="0 0 840 190" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fbff" />
      <stop offset="100%" stop-color="#e0f2fe" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#0284c7" stroke-width="0.5" stroke-opacity="0.06" />
    </pattern>
  </defs>

  <style>
    .hud-header {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-weight: 700;
      fill: #0284c7;
      font-size: 11px;
      letter-spacing: 1.5px;
    }
    .proj-title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-weight: 800;
      fill: #0f172a;
      font-size: 16px;
    }
    .tag-bg {
      fill: #e0f2fe;
      stroke: #7dd3fc;
      stroke-width: 1;
    }
    .tag-text {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-weight: 700;
      fill: #0369a1;
      font-size: 10px;
    }
    .bullet-icon {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-weight: 700;
      fill: #0284c7;
      font-size: 12px;
    }
    .bullet-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-weight: 500;
      fill: #334155;
      font-size: 12.5px;
    }
  </style>

  <!-- Card Background -->
  <rect width="840" height="190" rx="14" fill="url(#bgGrad)" stroke="#bae6fd" stroke-width="1.5" />
  <rect width="840" height="190" rx="14" fill="url(#grid)" />

  <!-- Left Accent Bar -->
  <rect x="0" y="24" width="5" height="142" rx="2.5" fill="url(#blueGrad)" />

  <!-- Header & Title -->
  <text x="28" y="32" class="hud-header">[ MODULE_03 // MYTHRA_MULTIMODAL_AI ]</text>
  <text x="28" y="56" class="proj-title">MYTHRA – Multimodal Storyteller Orchestration Engine</text>

  <!-- Tech Stack Pills -->
  <g transform="translate(28, 68)">
    <rect x="0" y="0" width="66" height="20" rx="5" class="tag-bg" />
    <text x="33" y="13.5" text-anchor="middle" class="tag-text">PYTHON</text>

    <rect x="74" y="0" width="72" height="20" rx="5" class="tag-bg" />
    <text x="110" y="13.5" text-anchor="middle" class="tag-text">REACT.JS</text>

    <rect x="154" y="0" width="84" height="20" rx="5" class="tag-bg" />
    <text x="196" y="13.5" text-anchor="middle" class="tag-text">REST_APIs</text>

    <rect x="246" y="0" width="116" height="20" rx="5" class="tag-bg" />
    <text x="304" y="13.5" text-anchor="middle" class="tag-text">LLM_DIFFUSION_TTS</text>
  </g>

  <!-- Bullet Points -->
  <g transform="translate(28, 108)">
    <text x="0" y="12" class="bullet-icon">&#9656;</text>
    <text x="16" y="12" class="bullet-text">Integrated 3 distinct AI models (LLMs, Text-to-Image, Neural TTS) into a unified REST pipeline.</text>

    <text x="0" y="38" class="bullet-icon">&#9656;</text>
    <text x="16" y="38" class="bullet-text">Optimized async orchestration, cutting latency by 45% to generate 10-14 scenes in 30-40s.</text>

    <text x="0" y="64" class="bullet-icon">&#9656;</text>
    <text x="16" y="64" class="bullet-text">Engineered a responsive React interface managing 5 concurrent real-time service streams.</text>
  </g>

  <!-- Right Telemetry Widget (Multimodal Flow Diagram) -->
  <g transform="translate(654, 22)">
    <rect width="162" height="146" rx="10" fill="#ffffff" fill-opacity="0.92" stroke="#7dd3fc" stroke-width="1.2" />
    <text x="81" y="22" text-anchor="middle" class="tag-text" fill="#0284c7">ASYNC_ORCHESTRATOR</text>
    <line x1="16" y1="30" x2="146" y2="30" stroke="#e0f2fe" stroke-width="1.5" />

    <!-- Top Node: LLM -->
    <rect x="31" y="40" width="100" height="20" rx="4" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2" />
    <text x="81" y="53.5" text-anchor="middle" class="tag-text" font-size="9">LLM_STORY_CORE</text>

    <!-- Connector Lines -->
    <path d="M 81 60 L 81 68 M 46 68 L 116 68 M 46 68 L 46 76 M 116 68 L 116 76" stroke="#0284c7" stroke-width="1.2" />

    <!-- Split Nodes: Image & Audio -->
    <rect x="16" y="76" width="60" height="22" rx="4" fill="#f0f9ff" stroke="#38bdf8" stroke-width="1.2" />
    <text x="46" y="90" text-anchor="middle" class="tag-text" font-size="8.5">DIFFUSION</text>

    <rect x="86" y="76" width="60" height="22" rx="4" fill="#f0f9ff" stroke="#2563eb" stroke-width="1.2" />
    <text x="116" y="90" text-anchor="middle" class="tag-text" font-size="8.5">NEURAL_TTS</text>

    <!-- Bottom Metric Pill -->
    <rect x="16" y="114" width="130" height="20" rx="5" fill="#e0f2fe" stroke="#7dd3fc" stroke-width="1" />
    <text x="81" y="127.5" text-anchor="middle" class="tag-text" fill="#0369a1">LATENCY: -45% FAST</text>
  </g>
</svg>
