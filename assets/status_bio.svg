<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 840 180" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080a10" />
      <stop offset="100%" stop-color="#0a0c14" />
    </linearGradient>
    
    <!-- Grid Pattern -->
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#00FFCC" stroke-width="0.5" stroke-opacity="0.04" />
    </pattern>
    
    <!-- Glow Filter -->
    <filter id="tealGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  
  <style>
    .mono-text {
      font-family: ui-monospace, SFMono-Regular, SF Mono, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      fill: #00FFCC;
      font-size: 13px;
      letter-spacing: 0.5px;
    }
    
    .label {
      fill: #627289;
      font-weight: bold;
    }

    .value {
      fill: #ffffff;
    }

    .hud-title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-weight: 700;
      fill: #00FFCC;
      font-size: 11.5px;
      letter-spacing: 2px;
    }
  </style>

  <!-- Background Base -->
  <rect width="840" height="180" fill="url(#bgGrad)" rx="8" />
  <rect width="840" height="180" fill="url(#grid)" rx="8" />
  
  <!-- Outer Border -->
  <rect x="10" y="10" width="820" height="160" fill="none" stroke="#00FFCC" stroke-width="1.2" stroke-opacity="0.15" rx="6" />

  <!-- Avatar HUD Box (Left) -->
  <g transform="translate(30, 25)">
    <rect width="130" height="130" fill="#0c0e15" stroke="#00FFCC" stroke-width="1.5" stroke-opacity="0.25" rx="4" />
    <path d="M 5 5 L 20 5 M 5 5 L 5 20 M 125 5 L 110 5 M 125 5 L 125 20 M 5 125 L 20 125 M 5 125 L 5 110 M 125 125 L 110 125 M 125 125 L 125 110" stroke="#00FFCC" stroke-width="2.5" filter="url(#tealGlow)" />
    
    <!-- Holographic Brain Icon (Centered inside 130x130 box, translation by cx=65, cy=65) -->
    <g transform="translate(10, 10)">
      <path d="M 55 25 C 40 25 35 35 35 45 C 35 55 45 60 45 70 C 45 78 50 82 55 85 C 60 82 65 78 65 70 C 65 60 75 55 75 45 C 75 35 70 25 55 25 Z" fill="none" stroke="#00FFCC" stroke-width="2" stroke-opacity="0.75" filter="url(#tealGlow)" />
      <path d="M 55 25 C 47 25 45 35 45 45 C 45 55 52 60 52 70" fill="none" stroke="#8A2BE2" stroke-width="1.5" stroke-opacity="0.65" />
      <circle cx="55" cy="48" r="3" fill="#8A2BE2" />
      <circle cx="48" cy="38" r="2" fill="#00FFCC" />
      <circle cx="62" cy="38" r="2" fill="#00FFCC" />
      <circle cx="43" cy="50" r="2" fill="#00FFCC" />
      <circle cx="67" cy="50" r="2" fill="#00FFCC" />
    </g>

    <!-- Animated Scanning Line -->
    <line x1="5" y1="20" x2="125" y2="20" stroke="#00FFCC" stroke-width="1.5" opacity="0.5">
      <animate attributeName="y1" values="10;120;10" dur="4.5s" repeatCount="indefinite" />
      <animate attributeName="y2" values="10;120;10" dur="4.5s" repeatCount="indefinite" />
    </line>
  </g>

  <!-- Spaced Bio & Education Info (Middle) -->
  <g transform="translate(190, 25)">
    <text x="0" y="10" class="hud-title">&lt; SYSTEM_IDENTITY_DATA &gt;</text>
    
    <!-- Details formatted with ample 24px vertical padding and separate text tags to prevent collision -->
    <text x="0" y="34" class="mono-text label">CODENAME:<tspan class="value" fill="#ffffff"> Vignesh G A</tspan></text>
    
    <!-- Multiline value split into safe lines -->
    <text x="0" y="58" class="mono-text label">OBJECTIVE:<tspan class="value" fill="#ffffff"> Designing autonomous multi-agent cognitive systems,</tspan></text>
    <text x="85" y="78" class="mono-text value">optimizing LLM pipelines and explaining model outputs.</text>

    <text x="0" y="104" class="mono-text label">ACADEMIA_01:<tspan class="value" fill="#ffffff"> VIT-AP University | B.Tech CSE (2023 - 2027)</tspan></text>
    <text x="0" y="128" class="mono-text label">ACADEMIA_02:<tspan class="value" fill="#ffffff"> IIT Ropar x Masai | AI Minor (2025 - 2026)</tspan></text>
  </g>

  <!-- Spacious Status Gauges (Right) -->
  <g transform="translate(645, 25)">
    <text x="0" y="10" class="hud-title">&lt; CORE_TELEMETRY &gt;</text>

    <!-- Gauge 1 -->
    <text x="0" y="32" class="mono-text" font-size="11" fill="#627289">AGENT_STRENGTH (98%)</text>
    <rect x="0" y="38" width="160" height="6" fill="#141923" rx="3" />
    <rect x="0" y="38" width="156" height="6" fill="#00FFCC" rx="3" filter="url(#tealGlow)" />

    <!-- Gauge 2 -->
    <text x="0" y="68" class="mono-text" font-size="11" fill="#627289">LOGIC_SYNCH (95%)</text>
    <rect x="0" y="74" width="160" height="6" fill="#141923" rx="3" />
    <rect x="0" y="74" width="152" height="6" fill="#8A2BE2" rx="3" />

    <!-- Gauge 3 -->
    <text x="0" y="104" class="mono-text" font-size="11" fill="#627289">SYNAPTIC_BW (88%)</text>
    <rect x="0" y="110" width="160" height="6" fill="#141923" rx="3" />
    <rect x="0" y="110" width="140" height="6" fill="#00FFCC" rx="3" opacity="0.65" />
  </g>
</svg>
