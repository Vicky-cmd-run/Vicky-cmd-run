<svg xmlns="http://www.w3.org/2000/svg" width="840" height="195" viewBox="0 0 840 195" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fbff" />
      <stop offset="100%" stop-color="#e0f2fe" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#0284c7" stroke-width="0.5" stroke-opacity="0.07" />
    </pattern>
  </defs>

  <style>
    .section-title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-weight: 800;
      fill: #0284c7;
      font-size: 11.5px;
      letter-spacing: 1.8px;
    }
    .key-label {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-weight: 700;
      fill: #0369a1;
      font-size: 12px;
    }
    .val-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-weight: 600;
      fill: #0f172a;
      font-size: 12.5px;
    }
    .gauge-label {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-weight: 700;
      fill: #1e293b;
      font-size: 11px;
    }
    .gauge-pct {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-weight: 700;
      fill: #0284c7;
      font-size: 11px;
    }
  </style>

  <!-- Card Base -->
  <rect width="840" height="195" rx="14" fill="url(#bgGrad)" stroke="#bae6fd" stroke-width="1.5" />
  <rect width="840" height="195" rx="14" fill="url(#grid)" />

  <!-- Left Hologram Node Box -->
  <g transform="translate(24, 22)">
    <rect width="140" height="150" rx="10" fill="#ffffff" fill-opacity="0.88" stroke="#7dd3fc" stroke-width="1.5" />
    <path d="M 8 22 L 8 8 L 22 8 M 132 22 L 132 8 L 118 8 M 8 128 L 8 142 L 22 142 M 132 128 L 132 142 L 118 142" stroke="#0284c7" stroke-width="2" stroke-linecap="round" />

    <!-- Neural Network Node Graphic -->
    <g transform="translate(15, 12)">
      <path d="M 55 22 C 38 22 30 34 30 46 C 30 58 42 64 42 76 C 42 85 48 90 55 94 C 62 90 68 85 68 76 C 68 64 80 58 80 46 C 80 34 72 22 55 22 Z" fill="#e0f2fe" stroke="#0284c7" stroke-width="2" />
      <line x1="45" y1="40" x2="65" y2="40" stroke="#2563eb" stroke-width="1.5" />
      <line x1="40" y1="54" x2="70" y2="54" stroke="#2563eb" stroke-width="1.5" />
      <line x1="55" y1="30" x2="55" y2="75" stroke="#0284c7" stroke-width="1.5" />
      <circle cx="55" cy="54" r="4" fill="#2563eb" />
      <circle cx="45" cy="40" r="3" fill="#0284c7" />
      <circle cx="65" cy="40" r="3" fill="#0284c7" />
      <circle cx="40" cy="54" r="3" fill="#0ea5e9" />
      <circle cx="70" cy="54" r="3" fill="#0ea5e9" />
    </g>

    <!-- Scanning Laser Line -->
    <line x1="10" y1="25" x2="130" y2="25" stroke="#0284c7" stroke-width="1.8" stroke-opacity="0.6">
      <animate attributeName="y1" values="16;120;16" dur="4s" repeatCount="indefinite" />
      <animate attributeName="y2" values="16;120;16" dur="4s" repeatCount="indefinite" />
    </line>
    <text x="70" y="135" text-anchor="middle" class="key-label" font-size="10">AI_ARCHITECT</text>
  </g>

  <!-- Center Identity & Education Panel (Strict X-Column Alignment) -->
  <g transform="translate(182, 22)">
    <rect width="432" height="150" rx="10" fill="#ffffff" fill-opacity="0.88" stroke="#bae6fd" stroke-width="1.2" />
    <text x="18" y="24" class="section-title">&lt; IDENTITY &amp; ACADEMIC NODES &gt;</text>
    <line x1="18" y1="32" x2="414" y2="32" stroke="#e0f2fe" stroke-width="1.5" />

    <!-- Fixed X=18 for Labels, X=130 for Values -->
    <text x="18" y="54" class="key-label">CODENAME</text>
    <text x="130" y="54" class="val-text">Vignesh G A (Amaravati, AP)</text>

    <text x="18" y="80" class="key-label">FOCUS_AREA</text>
    <text x="130" y="80" class="val-text">Agentic AI, Scalable Web &amp; Deep Learning</text>

    <text x="18" y="106" class="key-label">B.TECH_CSE</text>
    <text x="130" y="106" class="val-text">VIT-AP University (Aug 2023 – May 2027)</text>

    <text x="18" y="132" class="key-label">MINOR_IN_AI</text>
    <text x="130" y="132" class="val-text">IIT Ropar x Masai (Aug 2025 – May 2026)</text>
  </g>

  <!-- Right Telemetry Gauges Panel -->
  <g transform="translate(630, 22)">
    <rect width="186" height="150" rx="10" fill="#ffffff" fill-opacity="0.88" stroke="#bae6fd" stroke-width="1.2" />
    <text x="16" y="24" class="section-title">&lt; TELEMETRY &gt;</text>
    <line x1="16" y1="32" x2="170" y2="32" stroke="#e0f2fe" stroke-width="1.5" />

    <!-- Gauge 1 -->
    <text x="16" y="54" class="gauge-label">AGENT_ARCH</text>
    <text x="170" y="54" text-anchor="end" class="gauge-pct">98%</text>
    <rect x="16" y="60" width="154" height="7" rx="3.5" fill="#e0f2fe" />
    <rect x="16" y="60" width="150" height="7" rx="3.5" fill="url(#blueGrad)" />

    <!-- Gauge 2 -->
    <text x="16" y="92" class="gauge-label">FULL_STACK</text>
    <text x="170" y="92" text-anchor="end" class="gauge-pct">92%</text>
    <rect x="16" y="98" width="154" height="7" rx="3.5" fill="#e0f2fe" />
    <rect x="16" y="98" width="142" height="7" rx="3.5" fill="url(#cyanGrad)" />

    <!-- Gauge 3 -->
    <text x="16" y="130" class="gauge-label">MODEL_XAI</text>
    <text x="170" y="130" text-anchor="end" class="gauge-pct">90%</text>
    <rect x="16" y="136" width="154" height="7" rx="3.5" fill="#e0f2fe" />
    <rect x="16" y="136" width="138" height="7" rx="3.5" fill="url(#blueGrad)" />
  </g>
</svg>
