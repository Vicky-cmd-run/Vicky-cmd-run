<svg xmlns="http://www.w3.org/2000/svg" width="840" height="190" viewBox="0 0 840 190" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fbff" />
      <stop offset="100%" stop-color="#dbeafe" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#0284c7" stroke-width="0.5" stroke-opacity="0.06" />
    </pattern>
    <!-- Strict Clip Path so Left Text NEVER touches Right Box -->
    <clipPath id="leftTextClip">
      <rect x="0" y="0" width="600" height="190" />
    </clipPath>
    <clipPath id="rightBoxClip">
      <rect x="0" y="0" width="184" height="148" rx="10" />
    </clipPath>
  </defs>

  <style>
    .hud-header {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-weight: 700;
      fill: #0284c7;
      font-size: 11px;
      letter-spacing: 1.2px;
    }
    .proj-title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-weight: 800;
      fill: #0f172a;
      font-size: 16px;
    }
    .tag-bg {
      fill: #e0f2fe;
      stroke: #7dd3fc;
      stroke-width: 1;
    }
    .tag-text {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-weight: 700;
      fill: #0369a1;
      font-size: 9.5px;
    }
    .bullet-icon {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-weight: 700;
      fill: #0284c7;
      font-size: 12px;
    }
    .bullet-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-weight: 500;
      fill: #1e293b;
      font-size: 12px;
    }
  </style>

  <!-- Card Background -->
  <rect width="840" height="190" rx="14" fill="url(#bgGrad)" stroke="#93c5fd" stroke-width="1.5" />
  <rect width="840" height="190" rx="14" fill="url(#grid)" />

  <!-- Left Accent Bar -->
  <rect x="0" y="24" width="6" height="142" rx="3" fill="url(#blueGrad)" />

  <!-- Left Content Area (Strictly clipped at X=600) -->
  <g clip-path="url(#leftTextClip)">
    <text x="26" y="32" class="hud-header">[ MODULE_01 // NEXUS_RECON_PLATFORM ]</text>
    <text x="26" y="56" class="proj-title">NEXUS – AI-Driven Financial Reconciliation Platform</text>

    <!-- Tech Stack Pills -->
    <g transform="translate(26, 68)">
      <rect x="0" y="0" width="84" height="20" rx="5" class="tag-bg" />
      <text x="42" y="13.5" text-anchor="middle" class="tag-text">TYPESCRIPT</text>

      <rect x="92" y="0" width="70" height="20" rx="5" class="tag-bg" />
      <text x="127" y="13.5" text-anchor="middle" class="tag-text">REACT.JS</text>

      <rect x="170" y="0" width="64" height="20" rx="5" class="tag-bg" />
      <text x="202" y="13.5" text-anchor="middle" class="tag-text">PYTHON</text>

      <rect x="242" y="0" width="110" height="20" rx="5" class="tag-bg" />
      <text x="297" y="13.5" text-anchor="middle" class="tag-text">API_INTEGRATION</text>
    </g>

    <!-- Concise Bullet Points (<540px wide so they never clip or overlap) -->
    <g transform="translate(26, 108)">
      <text x="0" y="12" class="bullet-icon">&#9656;</text>
      <text x="16" y="12" class="bullet-text">Engineered FMCG financial reconciliation system (+80% detection speed).</text>

      <text x="0" y="38" class="bullet-icon">&#9656;</text>
      <text x="16" y="38" class="bullet-text">Automated mismatch detection across 500+ invoices at 95% accuracy.</text>

      <text x="0" y="64" class="bullet-icon">&#9656;</text>
      <text x="16" y="64" class="bullet-text">Built interactive drill-down modals, cutting data lookup time by 40%.</text>
    </g>
  </g>

  <!-- Right Telemetry Widget (Width=184, strictly clipped inside its box) -->
  <g transform="translate(634, 21)" clip-path="url(#rightBoxClip)">
    <rect width="184" height="148" rx="10" fill="#ffffff" fill-opacity="0.95" stroke="#7dd3fc" stroke-width="1.5" />
    <text x="92" y="22" text-anchor="middle" class="tag-text" fill="#0284c7">AUDIT_TELEMETRY</text>
    <line x1="16" y1="30" x2="168" y2="30" stroke="#dbeafe" stroke-width="1.5" />

    <!-- Bar 1 -->
    <text x="16" y="50" class="tag-text" fill="#334155">SPEED_GAIN</text>
    <text x="168" y="50" text-anchor="end" class="tag-text" fill="#0284c7">+80%</text>
    <rect x="16" y="56" width="152" height="7" rx="3.5" fill="#e0f2fe" />
    <rect x="16" y="56" width="122" height="7" rx="3.5" fill="url(#blueGrad)" />

    <!-- Bar 2 -->
    <text x="16" y="84" class="tag-text" fill="#334155">ACCURACY</text>
    <text x="168" y="84" text-anchor="end" class="tag-text" fill="#2563eb">95%</text>
    <rect x="16" y="90" width="152" height="7" rx="3.5" fill="#e0f2fe" />
    <rect x="16" y="90" width="144" height="7" rx="3.5" fill="#2563eb" />

    <!-- Bottom Pill -->
    <rect x="16" y="114" width="152" height="22" rx="5" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1" />
    <text x="92" y="128.5" text-anchor="middle" class="tag-text" fill="#0369a1">LOOKUP: -40% LATENCY</text>
  </g>
</svg>
