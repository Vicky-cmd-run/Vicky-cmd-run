<svg xmlns="http://www.w3.org/2000/svg" width="840" height="190" viewBox="0 0 840 190" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fbff" />
      <stop offset="100%" stop-color="#e0f2fe" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#0284c7" stroke-width="0.5" stroke-opacity="0.06" />
    </pattern>
  </defs>

  <style>
    .hud-header {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-weight: 700;
      fill: #0284c7;
      font-size: 11px;
      letter-spacing: 1.5px;
    }
    .proj-title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-weight: 800;
      fill: #0f172a;
      font-size: 16px;
    }
    .tag-bg {
      fill: #e0f2fe;
      stroke: #7dd3fc;
      stroke-width: 1;
    }
    .tag-text {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-weight: 700;
      fill: #0369a1;
      font-size: 10px;
    }
    .bullet-icon {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-weight: 700;
      fill: #0284c7;
      font-size: 12px;
    }
    .bullet-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-weight: 500;
      fill: #334155;
      font-size: 12.5px;
    }
    .highlight {
      font-weight: 700;
      fill: #0284c7;
    }
  </style>

  <!-- Card Background -->
  <rect width="840" height="190" rx="14" fill="url(#bgGrad)" stroke="#bae6fd" stroke-width="1.5" />
  <rect width="840" height="190" rx="14" fill="url(#grid)" />

  <!-- Left Accent Bar -->
  <rect x="0" y="24" width="5" height="142" rx="2.5" fill="url(#blueGrad)" />

  <!-- Header & Title -->
  <text x="28" y="32" class="hud-header">[ MODULE_01 // NEXUS_RECON_PLATFORM ]</text>
  <text x="28" y="56" class="proj-title">NEXUS – AI-Driven Financial Reconciliation Platform</text>

  <!-- Tech Stack Pills -->
  <g transform="translate(28, 68)">
    <rect x="0" y="0" width="88" height="20" rx="5" class="tag-bg" />
    <text x="44" y="13.5" text-anchor="middle" class="tag-text">TYPESCRIPT</text>

    <rect x="96" y="0" width="72" height="20" rx="5" class="tag-bg" />
    <text x="132" y="13.5" text-anchor="middle" class="tag-text">REACT.JS</text>

    <rect x="176" y="0" width="66" height="20" rx="5" class="tag-bg" />
    <text x="209" y="13.5" text-anchor="middle" class="tag-text">PYTHON</text>

    <rect x="250" y="0" width="112" height="20" rx="5" class="tag-bg" />
    <text x="306" y="13.5" text-anchor="middle" class="tag-text">API_INTEGRATION</text>
  </g>

  <!-- Bullet Points (Clean SVG elements without nested tspan shift issues) -->
  <g transform="translate(28, 108)">
    <text x="0" y="12" class="bullet-icon">&#9656;</text>
    <text x="16" y="12" class="bullet-text">Engineered full-stack FMCG reconciliation system, speeding discrepancy detection by 80%.</text>

    <text x="0" y="38" class="bullet-icon">&#9656;</text>
    <text x="16" y="38" class="bullet-text">Automated mismatch extraction across 500+ simulated invoices with 95% classification accuracy.</text>

    <text x="0" y="64" class="bullet-icon">&#9656;</text>
    <text x="16" y="64" class="bullet-text">Deployed interactive drill-down modals, cutting average financial lookup latency by 40%.</text>
  </g>

  <!-- Right Telemetry Widget -->
  <g transform="translate(654, 22)">
    <rect width="162" height="146" rx="10" fill="#ffffff" fill-opacity="0.92" stroke="#7dd3fc" stroke-width="1.2" />
    <text x="81" y="22" text-anchor="middle" class="tag-text" fill="#0284c7">AUDIT_TELEMETRY</text>
    <line x1="16" y1="30" x2="146" y2="30" stroke="#e0f2fe" stroke-width="1.5" />

    <!-- Bar 1 -->
    <text x="16" y="52" class="tag-text" fill="#475569">SPEED_GAIN</text>
    <text x="146" y="52" text-anchor="end" class="tag-text" fill="#0284c7">+80%</text>
    <rect x="16" y="58" width="130" height="7" rx="3.5" fill="#e0f2fe" />
    <rect x="16" y="58" width="104" height="7" rx="3.5" fill="url(#blueGrad)" />

    <!-- Bar 2 -->
    <text x="16" y="88" class="tag-text" fill="#475569">ACCURACY</text>
    <text x="146" y="88" text-anchor="end" class="tag-text" fill="#2563eb">95%</text>
    <rect x="16" y="94" width="130" height="7" rx="3.5" fill="#e0f2fe" />
    <rect x="16" y="94" width="123" height="7" rx="3.5" fill="#2563eb" />

    <!-- Status Pill -->
    <rect x="16" y="114" width="130" height="20" rx="5" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1" />
    <text x="81" y="127.5" text-anchor="middle" class="tag-text" fill="#0369a1">LOOKUP: -40% TIME</text>
  </g>
</svg>
