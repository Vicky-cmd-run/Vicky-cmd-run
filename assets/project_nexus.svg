<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 840 180" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080a10" />
      <stop offset="100%" stop-color="#0a0c14" />
    </linearGradient>
    
    <!-- Grid Pattern -->
    <pattern id="grid" width="15" height="15" patternUnits="userSpaceOnUse">
      <path d="M 15 0 L 0 0 0 15" fill="none" stroke="#00FFCC" stroke-width="0.5" stroke-opacity="0.04" />
    </pattern>
    
    <!-- Glow Filter -->
    <filter id="tealGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .mono-text {
      font-family: ui-monospace, SFMono-Regular, SF Mono, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      fill: #ffffff;
      font-size: 11.5px;
      letter-spacing: 0.5px;
    }
    
    .hud-header {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-weight: 700;
      fill: #00FFCC;
      font-size: 10.5px;
      letter-spacing: 2px;
    }

    .proj-title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-weight: 700;
      fill: #ffffff;
      font-size: 15.5px;
      letter-spacing: 0.5px;
    }

    .tag-bg {
      fill: #121926;
      stroke: #00FFCC;
      stroke-opacity: 0.3;
    }

    .tag-text {
      font-family: ui-monospace, SFMono-Regular, SF Mono, Menlo, Monaco, Consolas, monospace;
      fill: #00FFCC;
      font-size: 9.5px;
    }

    .bullet-point {
      fill: #a0aec0;
      font-size: 11.5px;
    }
  </style>

  <!-- Background Base -->
  <rect width="840" height="180" fill="url(#bgGrad)" rx="8" />
  <rect width="840" height="180" fill="url(#grid)" rx="8" />
  
  <!-- Outer Border with Glowing Accent Corner -->
  <rect x="10" y="10" width="820" height="160" fill="none" stroke="#00FFCC" stroke-width="1.2" stroke-opacity="0.15" rx="6" />
  <path d="M 10 35 L 10 10 L 35 10" fill="none" stroke="#00FFCC" stroke-width="2" filter="url(#tealGlow)" />

  <!-- Code/Module ID Tag -->
  <text x="30" y="28" class="hud-header">[ CORE_MODULE_01: NEXUS_RECON_MATRIX ]</text>

  <!-- Project Title -->
  <text x="30" y="52" class="proj-title">NEXUS – AI-Driven Financial Reconciliation Platform</text>

  <!-- Technology Badges -->
  <g transform="translate(30, 62)">
    <rect x="0" y="0" width="90" height="18" class="tag-bg" rx="3" />
    <text x="45" y="12" text-anchor="middle" class="tag-text">TYPESCRIPT</text>

    <rect x="95" y="0" width="60" height="18" class="tag-bg" rx="3" />
    <text x="125" y="12" text-anchor="middle" class="tag-text">REACT.JS</text>

    <rect x="160" y="0" width="65" height="18" class="tag-bg" rx="3" />
    <text x="192.5" y="12" text-anchor="middle" class="tag-text">PYTHON</text>

    <rect x="230" y="0" width="105" height="18" class="tag-bg" rx="3" />
    <text x="282.5" y="12" text-anchor="middle" class="tag-text">API_INTEGRATION</text>
  </g>

  <!-- Spaced Bullet Points -->
  <g transform="translate(30, 96)">
    <!-- Y intervals expanded to 23px for absolute overlap prevention -->
    <text x="0" y="12" class="mono-text" fill="#00FFCC">&gt;</text>
    <text x="15" y="12" class="mono-text bullet-point">Engineered a full-stack FMCG financial reconciliation system, speeding detection by <tspan fill="#00FFCC" font-weight="bold">80%</tspan>.</text>
    
    <text x="0" y="35" class="mono-text" fill="#00FFCC">&gt;</text>
    <text x="15" y="35" class="mono-text bullet-point">Built discrepancy pipelines classifying 500+ invoice anomalies with <tspan fill="#ffffff" font-weight="bold">95% accuracy</tspan>.</text>
    
    <text x="0" y="58" class="mono-text" fill="#00FFCC">&gt;</text>
    <text x="15" y="58" class="mono-text bullet-point">Deployed responsive frontend dashboards with drill-downs, cutting lookup latency by <tspan fill="#00FFCC" font-weight="bold">40%</tspan>.</text>
  </g>

  <!-- Visual Widget Panel (Right) -->
  <g transform="translate(670, 30)">
    <rect width="130" height="120" fill="#0c0e15" stroke="#00FFCC" stroke-width="1.2" stroke-opacity="0.2" rx="4" />
    <text x="65" y="18" text-anchor="middle" class="tag-text" fill="#627289" font-size="9">COMPARATIVE_RECON</text>
    
    <!-- Holographic Bar Matrix -->
    <text x="12" y="44" class="mono-text" font-size="9.5" fill="#627289">LGR_A</text>
    <rect x="50" y="36" width="65" height="8" fill="#141a24" rx="2" />
    <rect x="50" y="36" width="55" height="8" fill="#8A2BE2" rx="2" />

    <text x="12" y="68" class="mono-text" font-size="9.5" fill="#627289">LGR_B</text>
    <rect x="50" y="60" width="65" height="8" fill="#141a24" rx="2" />
    <rect x="50" y="60" width="48" height="8" fill="#e200ff" rx="2" />

    <!-- Delta Alert -->
    <g transform="translate(15, 84)">
      <path d="M 10 5 L 18 20 L 2 20 Z" fill="none" stroke="#FF3366" stroke-width="1.2" filter="url(#tealGlow)">
        <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
      </path>
      <text x="25" y="15" class="mono-text" font-size="9" fill="#FF3366" font-weight="bold">DELTA_MISMATCH</text>
      <text x="25" y="26" class="mono-text" font-size="8" fill="#627289">CONFIDENCE: 99.8%</text>
    </g>
  </g>
</svg>
