<svg xmlns="http://www.w3.org/2000/svg" width="840" height="190" viewBox="0 0 840 190" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fbff" />
      <stop offset="100%" stop-color="#e0f2fe" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#0284c7" stroke-width="0.5" stroke-opacity="0.06" />
    </pattern>
  </defs>

  <style>
    .hud-header {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-weight: 700;
      fill: #2563eb;
      font-size: 11px;
      letter-spacing: 1.5px;
    }
    .proj-title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-weight: 800;
      fill: #0f172a;
      font-size: 16px;
    }
    .tag-bg {
      fill: #e0f2fe;
      stroke: #7dd3fc;
      stroke-width: 1;
    }
    .tag-text {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-weight: 700;
      fill: #0369a1;
      font-size: 10px;
    }
    .bullet-icon {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-weight: 700;
      fill: #2563eb;
      font-size: 12px;
    }
    .bullet-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-weight: 500;
      fill: #334155;
      font-size: 12.5px;
    }
  </style>

  <!-- Card Background -->
  <rect width="840" height="190" rx="14" fill="url(#bgGrad)" stroke="#bae6fd" stroke-width="1.5" />
  <rect width="840" height="190" rx="14" fill="url(#grid)" />

  <!-- Left Accent Bar -->
  <rect x="0" y="24" width="5" height="142" rx="2.5" fill="url(#blueGrad)" />

  <!-- Header & Title -->
  <text x="28" y="32" class="hud-header">[ MODULE_02 // EXPLAINABLE_RUL_PREDICTION ]</text>
  <text x="28" y="56" class="proj-title">Unlocking the Black Box – Aero-Engine RUL Prediction</text>

  <!-- Tech Stack Pills -->
  <g transform="translate(28, 68)">
    <rect x="0" y="0" width="66" height="20" rx="5" class="tag-bg" />
    <text x="33" y="13.5" text-anchor="middle" class="tag-text">PYTHON</text>

    <rect x="74" y="0" width="92" height="20" rx="5" class="tag-bg" />
    <text x="120" y="13.5" text-anchor="middle" class="tag-text">TENSORFLOW</text>

    <rect x="174" y="0" width="102" height="20" rx="5" class="tag-bg" />
    <text x="225" y="13.5" text-anchor="middle" class="tag-text">TRANSFORMERS</text>

    <rect x="284" y="0" width="76" height="20" rx="5" class="tag-bg" />
    <text x="322" y="13.5" text-anchor="middle" class="tag-text">SHAP_XAI</text>
  </g>

  <!-- Bullet Points -->
  <g transform="translate(28, 108)">
    <text x="0" y="12" class="bullet-icon">&#9656;</text>
    <text x="16" y="12" class="bullet-text">Engineered temporal sequences from NASA C-MAPSS (100+ trajectories, 20k+ engine cycles).</text>

    <text x="0" y="38" class="bullet-icon">&#9656;</text>
    <text x="16" y="38" class="bullet-text">Trained hybrid CNN-Transformer-BiLSTM achieving RMSE 14.60, MAE 12.09, and R2 0.848 (+15%).</text>

    <text x="0" y="64" class="bullet-icon">&#9656;</text>
    <text x="16" y="64" class="bullet-text">Applied SHAP &amp; Integrated Gradients to isolate top 5 critical sensor features for predictive trust.</text>
  </g>

  <!-- Right Telemetry Widget (Degradation Curve) -->
  <g transform="translate(654, 22)">
    <rect width="162" height="146" rx="10" fill="#ffffff" fill-opacity="0.92" stroke="#7dd3fc" stroke-width="1.2" />
    <text x="81" y="22" text-anchor="middle" class="tag-text" fill="#2563eb">RUL_DEGRADATION</text>
    <line x1="16" y1="30" x2="146" y2="30" stroke="#e0f2fe" stroke-width="1.5" />

    <!-- Coordinate Grid -->
    <line x1="24" y1="42" x2="24" y2="108" stroke="#94a3b8" stroke-width="1.2" />
    <line x1="24" y1="108" x2="142" y2="108" stroke="#94a3b8" stroke-width="1.2" />
    <line x1="24" y1="64" x2="142" y2="64" stroke="#e2e8f0" stroke-dasharray="3,3" />
    <line x1="24" y1="86" x2="142" y2="86" stroke="#e2e8f0" stroke-dasharray="3,3" />

    <!-- Sensor Data Dots -->
    <circle cx="38" cy="48" r="2" fill="#64748b" />
    <circle cx="56" cy="54" r="2" fill="#64748b" />
    <circle cx="76" cy="63" r="2" fill="#64748b" />
    <circle cx="96" cy="78" r="2" fill="#64748b" />
    <circle cx="116" cy="92" r="2" fill="#64748b" />
    <circle cx="134" cy="103" r="2" fill="#64748b" />

    <!-- Smooth Curve -->
    <path d="M 26 45 Q 72 52, 98 78 T 138 104" fill="none" stroke="url(#blueGrad)" stroke-width="2.5" stroke-linecap="round" />

    <!-- Score Pill -->
    <rect x="16" y="116" width="130" height="20" rx="5" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1" />
    <text x="81" y="129.5" text-anchor="middle" class="tag-text" fill="#2563eb">R2: 0.848 | RMSE: 14.6</text>
  </g>
</svg>
