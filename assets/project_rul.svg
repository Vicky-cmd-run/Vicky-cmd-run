<svg xmlns="http://www.w3.org/2000/svg" width="840" height="190" viewBox="0 0 840 190" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fbff" />
      <stop offset="100%" stop-color="#dbeafe" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#0284c7" stroke-width="0.5" stroke-opacity="0.06" />
    </pattern>
    <clipPath id="leftTextClip">
      <rect x="0" y="0" width="600" height="190" />
    </clipPath>
    <clipPath id="rightBoxClip">
      <rect x="0" y="0" width="184" height="148" rx="10" />
    </clipPath>
  </defs>

  <style>
    .hud-header {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-weight: 700;
      fill: #2563eb;
      font-size: 11px;
      letter-spacing: 1.2px;
    }
    .proj-title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-weight: 800;
      fill: #0f172a;
      font-size: 16px;
    }
    .tag-bg {
      fill: #e0f2fe;
      stroke: #7dd3fc;
      stroke-width: 1;
    }
    .tag-text {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-weight: 700;
      fill: #0369a1;
      font-size: 9.5px;
    }
    .bullet-icon {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-weight: 700;
      fill: #2563eb;
      font-size: 12px;
    }
    .bullet-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-weight: 500;
      fill: #1e293b;
      font-size: 12px;
    }
  </style>

  <!-- Card Background -->
  <rect width="840" height="190" rx="14" fill="url(#bgGrad)" stroke="#93c5fd" stroke-width="1.5" />
  <rect width="840" height="190" rx="14" fill="url(#grid)" />

  <!-- Left Accent Bar -->
  <rect x="0" y="24" width="6" height="142" rx="3" fill="url(#blueGrad)" />

  <!-- Left Content Area (Strictly clipped at X=600) -->
  <g clip-path="url(#leftTextClip)">
    <text x="26" y="32" class="hud-header">[ MODULE_02 // EXPLAINABLE_RUL_PREDICTION ]</text>
    <text x="26" y="56" class="proj-title">Unlocking the Black Box – Aero-Engine RUL Prediction</text>

    <!-- Tech Stack Pills -->
    <g transform="translate(26, 68)">
      <rect x="0" y="0" width="64" height="20" rx="5" class="tag-bg" />
      <text x="32" y="13.5" text-anchor="middle" class="tag-text">PYTHON</text>

      <rect x="72" y="0" width="90" height="20" rx="5" class="tag-bg" />
      <text x="117" y="13.5" text-anchor="middle" class="tag-text">TENSORFLOW</text>

      <rect x="170" y="0" width="100" height="20" rx="5" class="tag-bg" />
      <text x="220" y="13.5" text-anchor="middle" class="tag-text">TRANSFORMERS</text>

      <rect x="278" y="0" width="76" height="20" rx="5" class="tag-bg" />
      <text x="316" y="13.5" text-anchor="middle" class="tag-text">SHAP_XAI</text>
    </g>

    <!-- Concise Bullet Points (<540px wide) -->
    <g transform="translate(26, 108)">
      <text x="0" y="12" class="bullet-icon">&#9656;</text>
      <text x="16" y="12" class="bullet-text">Processed NASA C-MAPSS sequences (100+ trajectories, 20k+ cycles).</text>

      <text x="0" y="38" class="bullet-icon">&#9656;</text>
      <text x="16" y="38" class="bullet-text">Trained CNN-Transformer-BiLSTM (RMSE: 14.60, R2: 0.848, +15% gain).</text>

      <text x="0" y="64" class="bullet-icon">&#9656;</text>
      <text x="16" y="64" class="bullet-text">Applied SHAP &amp; Integrated Gradients to isolate top 5 sensor features.</text>
    </g>
  </g>

  <!-- Right Telemetry Widget (Degradation Curve) -->
  <g transform="translate(634, 21)" clip-path="url(#rightBoxClip)">
    <rect width="184" height="148" rx="10" fill="#ffffff" fill-opacity="0.95" stroke="#7dd3fc" stroke-width="1.5" />
    <text x="92" y="22" text-anchor="middle" class="tag-text" fill="#2563eb">RUL_DEGRADATION</text>
    <line x1="16" y1="30" x2="168" y2="30" stroke="#dbeafe" stroke-width="1.5" />

    <!-- Coordinate Grid -->
    <line x1="26" y1="42" x2="26" y2="106" stroke="#94a3b8" stroke-width="1.2" />
    <line x1="26" y1="106" x2="160" y2="106" stroke="#94a3b8" stroke-width="1.2" />
    <line x1="26" y1="63" x2="160" y2="63" stroke="#e2e8f0" stroke-dasharray="3,3" />
    <line x1="26" y1="84" x2="160" y2="84" stroke="#e2e8f0" stroke-dasharray="3,3" />

    <!-- Sensor Data Dots -->
    <circle cx="42" cy="48" r="2" fill="#64748b" />
    <circle cx="64" cy="54" r="2" fill="#64748b" />
    <circle cx="88" cy="63" r="2" fill="#64748b" />
    <circle cx="110" cy="78" r="2" fill="#64748b" />
    <circle cx="132" cy="92" r="2" fill="#64748b" />
    <circle cx="150" cy="101" r="2" fill="#64748b" />

    <!-- Smooth Curve -->
    <path d="M 28 45 Q 80 52, 112 78 T 156 102" fill="none" stroke="url(#blueGrad)" stroke-width="2.5" stroke-linecap="round" />

    <!-- Score Pill -->
    <rect x="16" y="114" width="152" height="22" rx="5" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1" />
    <text x="92" y="128.5" text-anchor="middle" class="tag-text" fill="#2563eb">R2: 0.848 | RMSE: 14.6</text>
  </g>
</svg>
